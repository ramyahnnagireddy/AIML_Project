```yaml
name: W8D1 Production RAG CI/CD

on:
  push:
    branches:
      - master
      - "feat/aiml-W8-Ramya"
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/production-rag-api

jobs:
  validate:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: W8D1_Production_RAG_MLOps/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r W8D1_Production_RAG_MLOps/requirements.txt

      - name: Run Ruff
        run: python -m ruff check W8D1_Production_RAG_MLOps/app W8D1_Production_RAG_MLOps/tests

      - name: Run tests
        run: python -m pytest W8D1_Production_RAG_MLOps/tests -v

  build-and-push:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: W8D1_Production_RAG_MLOps/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
```
